name: Build NexusLink Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Gradle & Generate Wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.8-bin.zip
          unzip -q gradle-8.8-bin.zip
          sudo ln -s $(pwd)/gradle-8.8/bin/gradle /usr/bin/gradle
          gradle wrapper --gradle-version 8.8
          chmod +x gradlew

      - name: Setup Gradle Caching
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mod JAR
        run: ./gradlew build

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexuslink-mod
          path: build/libs/*.jar
